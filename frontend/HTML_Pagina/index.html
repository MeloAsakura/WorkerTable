<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WorkTable</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="StyleLoginPage/main-layout.css">
    <link rel="stylesheet" href="StyleLoginPage/box-styles.css">
    <link rel="stylesheet" href="StyleLoginPage/auth-dialog.css">
    <link rel="stylesheet" href="StyleLoginPage/task-list.css">


</head>



<div class="ladoEsq">
    <div class="logoNome">
        <h1>WorkTable</h1>
    </div>

    <div class="descricaoPagina">
        <h1 id="texto-digitado"></h1>
        <p id="paragrafo1"></p>
        <p id="paragrafo2"></p>
        <p id="paragrafo3"></p>
    </div>


    <div class="buttonLogin">
        <button type="button" class='btnLogin' aria-expanded="false">LOGIN</button>
    </div>

    <dialog class="janelalOGIN">

        <form action="/login" method="post" class="login">

            <div class="email">
                <label for="email">Email</label>
                <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                >
            </div>

            <div class="senha" >
                <div class="senha-cabecalho">
                    <label for="senha">Senha</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <input
                        id="senha"
                        name="senha"
                        type="password"
                        autocomplete="current-password"
                        required
                >
            </div>

            <button type="submit" >Entrar</button>

            <button type="button" class="gsi-material-button" >
                <div class="gsi-material-button-state"></div>
                <div class="gsi-material-button-content-wrapper">
                    <div class="gsi-material-button-icon">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                             style="display: block;"
                             aria-hidden="true">
                            <path fill="#EA4335"
                                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                            <path fill="#4285F4"
                                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                            <path fill="#FBBC05"
                                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                            <path fill="#34A853"
                                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                            <path fill="none" d="M0 0h48v48H0z"></path>
                        </svg>
                    </div>
                    <span class="gsi-material-button-contents">Fazer login com o Google</span>
                </div>
            </button>

        </form>
    </dialog>

</div>

<div class="ladoDir" id="ladoDir">
    <button type="button" class="setaVoltar" id="setaVoltar" aria-label="Mostrar painel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             aria-hidden="true">
            <path d="M9 6l6 6-6 6"/>
        </svg>
    </button>


    <div id="menuLateral" class="menuLateral">
        <button type="button" class="btnAddBox" id="btnAdd" aria-label="Adicionar box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5"
                 aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
            </svg>
        </button>

        <button type="button" id="areaDeTables" class="btnTableBox" aria-label="Adicionar área de tables" title="Adicionar área">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                 fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="13" height="13" rx="3"/>
                <path d="M6.5 7.5h6"/>
                <rect x="6.5" y="10" width="6" height="3" rx="1.5"/>
                <path d="M18.5 15.5v6M15.5 18.5h6"/>
            </svg>
        </button>
    </div>

    <template id="modeloTarefa">
        <li>
            <div id="caixaDeTarefas" >
            <div class="textoTopo">
                <span class="textoTitulo"></span>

                <button type="button" class="buttonOpcoes" aria-label="Opções" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
                    </svg>
                </button>

                <div class="acoes">

                    <button type="button" class="acaoItem buttonParticipantes" aria-expanded="false" title="Participantes">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
                        </svg>
                        <span>Participantes</span>
                    </button>

                    <button type="button" class="acaoItem buttonNotes" aria-expanded="false" title="Descrição">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        <span>Descrição</span>
                    </button>

                    <button type="button" class="acaoItem buttonData" aria-label="Definir datas" aria-expanded="false" title="Datas">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>Datas</span>
                    </button>

                    <div class="acaoDivisor"></div>

                    <button type="button" class="acaoItem buttonRemover" aria-label="Remover tarefa" title="Remover">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        <span>Remover</span>
                    </button>

                    <button type="button" class="acaoItem buttonConcluido" aria-label="Botao De Conclusao" title="Concluir">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <span>Concluir</span>
                    </button>

                </div>
            </div>

            <small class="textoHidden" hidden></small>
            <small class="descricaoHidden" hidden></small>

            <div class="datasInicioeFim" hidden>
                <div class="campoData">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="text" class="dataInicio" placeholder="Início">
                </div>
                <div class="campoData">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="text" class="dataFim" placeholder="Fim">
                </div>
            </div>

            <div class="descricaoNotes" hidden>
                <div class="campoDescricao">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/>
                    </svg>
                    <input type="text" class="inputDescricao" placeholder="Descrição">
                </div>
            </div>
            </div>
        </li>

    </template>

    <template id="createBox">
        <div class="newBoxTable">
            <div class="tituloNovaBox">
                <label class="boxNewNome">
                    <input type="text" value="WorkTable" class="inputDoTituloNovaBox">
                </label>
            </div>

            <div class="TituloNovaBoxTarefa">
                <label class="nomeNovaBoxTarefa"></label>
                <input type="text" value="Nova Tarefa" class="inputNomeNovaBoxTarefa" required>
                <button type="button" class="buttonCreateBox"></button>
            </div>

            <div>
                <button type="button" class="buttonRemoverNewBox">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="10" height="10">
                        <path d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"/>
                    </svg>
                </button>
            </div>

            <ul class="newListaDeTarefasTemplate"></ul>
        </div>
    </template>

    <template id="boxTransparente">
        <div class="SandBox">
            <div class="dicaContainer">
                <span class="dicaIcone">+</span>
            </div>
            <div class="armazenamentoPasta"></div>
            <div class="miniaturasPasta"></div>
        </div>

    </template>
</div>

<script src="Scripts/task-manager.js"></script>
<script src="Scripts/box-interactions.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
<script src="Scripts/box-factory.js"></script>
<script src="Scripts/welcome-animation.js"></script>
<script src="Scripts/auth-dialog.js"></script>
<script src="Scripts/folder-manager.js"></script>

</html>
